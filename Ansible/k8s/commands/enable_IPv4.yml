---
- name: Configura la IPV4 para K8s
  hosts: kubernetes
  become: true
  gather_facts: false
  tasks:
    - name: Add the k8s.conf file to sysctl
      ansible.builtin.shell: |
        cat <<EOF | sudo tee  /etc/sysctl.d/k8s.conf
        net.ipv4.ip_forward = 1
        EOF

    - name: Carga el archivo k8s.conf 
      ansible.builtin.shell:
        sudo sysctl --system